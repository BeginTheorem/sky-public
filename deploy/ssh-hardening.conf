# SkyNet SSH hardening. Keep the main distro config untouched.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
# Set __DEPLOY_USER__ to the deploy account before applying this snippet.
AllowUsers __DEPLOY_USER__
LogLevel VERBOSE
SyslogFacility AUTHPRIV
X11Forwarding no
